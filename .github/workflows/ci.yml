name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No version is specified here: pnpm/action-setup reads the
      # `packageManager` field in package.json (pnpm@11.17.0) so CI always
      # matches the exact pnpm major/version used to generate the lockfile.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Node's native TypeScript execution (used by apps/web's "test"
      # script) needs Node >=22.6 -- satisfied here since node-version
      # above is pinned to 24, independent of the broader Node range the
      # app itself supports for building/running (see root package.json
      # engines).
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
